{% extends 'base.html' %}
{% from 'macros.html' import render_photo %}

{% block header %}
    <header>
        <div id="carouselExample" class="carousel slide mb-5">
            <div class="carousel-inner">
                <div class="carousel-item active">
                    <img src="{{ url_for('static', filename='uploads/c1.png') }}"
                         class="d-block w-100"
                         style="height: 500px; object-fit: cover;"
                         alt="...">
                </div>
                <div class="carousel-item">
                    <img src="{{ url_for('static', filename='uploads/c2.png') }}"
                         class="d-block w-100"
                         style="height: 500px; object-fit: cover;"
                         alt="...">
                </div>
                <div class="carousel-item">
                    <img src="{{ url_for('static', filename='uploads/c3.png') }}"
                         class="d-block w-100"
                         style="height: 500px; object-fit: cover;"
                         alt="...">
                </div>
            </div>
            <button class="carousel-control-prev" type="button" data-bs-target="#carouselExample" data-bs-slide="prev">
                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Previous</span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#carouselExample" data-bs-slide="next">
                <span class="carousel-control-next-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Next</span>
            </button>
        </div>
    </header>
{% endblock %}

{% block main %}
    <main>
        <h1 class="display-4 mx-3 mt-3 mb-5">{{ title }}</h1>
        <div class="container text-center">
            <div class="row">
                {% for photo in photos %}
                    {{ render_photo(photo) }}
                {% endfor %}
            </div>
        </div>
    </main>
{% endblock %}
